services:
  - type: web
    name: gym-whatsapp-bot
    runtime: node
    plan: free
    region: singapore
    rootDir: worker
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: WHATSAPP_API_SECRET
        value: dev_whatsapp_secret
      - key: PORT
        value: 10000
